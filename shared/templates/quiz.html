<!doctype html>
<html lang="en" data-theme="{{theme}}"{{worldAttr}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="{{themeColor}}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{kidName}}">
<meta name="apple-mobile-web-app-status-bar-style" content="{{statusBar}}">
<title>{{title}} · {{kidName}}</title>
<link rel="manifest" href="{{root}}{{kid}}/manifest.webmanifest">
<link rel="icon" type="image/png" href="{{root}}{{kid}}/icons/icon-192.png">
<link rel="apple-touch-icon" href="{{root}}{{kid}}/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{fonts}}">
{{worldHead}}
<link rel="stylesheet" href="{{root}}assets/base.css">
<link rel="stylesheet" href="{{root}}assets/themes/{{theme}}.css">
<link rel="stylesheet" href="{{root}}assets/engine.css">
{{worldCss}}
</head>
<body>
<div class="band" aria-hidden="true"></div>
<div class="shell">
  <div class="kidbar" id="kidbar"></div>
  <header class="top" id="top"></header>
  <main id="app"></main>
  <p class="foot" id="foot"></p>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">This quiz needs JavaScript to run.</p></noscript>
<script type="application/json" id="qh-config">{{config}}</script>
<script src="{{root}}assets/icons.js"></script>
<script src="{{root}}assets/grader.js"></script>
<script src="{{root}}assets/heroes.js"></script>
<script src="{{root}}assets/engine.js"></script>
</body>
</html>
