<!doctype html>
<html lang="en" data-theme="{{theme}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="{{themeColor}}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{kidName}}">
<meta name="apple-mobile-web-app-status-bar-style" content="{{statusBar}}">
<title>{{hubTitle}}</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{fonts}}">
<link rel="stylesheet" href="{{root}}assets/base.css">
<link rel="stylesheet" href="{{root}}assets/themes/{{theme}}.css">
<link rel="stylesheet" href="{{root}}assets/hub.css">
</head>
<body>
<div class="band" aria-hidden="true"></div>
<div class="shell">
  <header class="hub-top">
    <a class="hub-brand" href="./"><span class="hub-brand-icon" id="hub-brand-icon"></span><span class="hub-title">{{hubTitle}}</span></a>
    <a class="switch" href="{{root}}" aria-label="Switch student"><span id="hub-switch-icon" style="display:inline-flex"></span><span>Switch</span></a>
  </header>
  <section class="panel hub-hero" id="hub-hero" aria-label="Your level"></section>
  <main id="view"></main>
  <footer class="hub-foot">
    <span class="school" id="hub-school"></span>
    <p>Home-made study tools. Not an official school website.</p>
  </footer>
</div>
<noscript><p style="padding:24px">This page needs JavaScript to run.</p></noscript>
<script type="application/json" id="qh-config">{{config}}</script>
<script src="{{root}}assets/icons.js"></script>
<script src="{{root}}assets/hub.js"></script>
</body>
</html>
